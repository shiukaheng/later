<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="light dark">
<title>Home / X</title>
<style>
  :root { --bg: #fff; --text: #0f1419; --muted: #536471; --line: #eff3f4; --blue: #1d9bf0; --pink: #f91880;
          --bar: rgba(255,255,255,.85); --hover: rgba(0,0,0,.03); --tab-hover: rgba(15,20,25,.1); --avatar: #cfd9de; }
  @media (prefers-color-scheme: dark) {  /* X "Lights out" */
    :root { --bg: #000; --text: #e7e9ea; --muted: #71767b; --line: #2f3336;
            --bar: rgba(0,0,0,.65); --hover: rgba(255,255,255,.03); --tab-hover: rgba(231,233,234,.1); --avatar: #333639; }
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--text);
         font: 15px/20px -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; }
  #feed { max-width: 600px; margin: 0 auto; border-left: 1px solid var(--line); border-right: 1px solid var(--line); min-height: 100vh; }
  .tabs { position: sticky; top: 0; z-index: 2; display: flex; background: var(--bar);
          backdrop-filter: blur(12px); -webkit-backdrop-filter: blur(12px); border-bottom: 1px solid var(--line); }
  .tab { flex: 1; text-align: center; padding: 16px 0 0; color: var(--muted); font-weight: 500; cursor: pointer; }
  .tab span { display: inline-block; padding-bottom: 14px; }
  .tab.on { color: var(--text); font-weight: 700; }
  .tab.on span { border-bottom: 4px solid var(--blue); border-radius: 2px; }
  .tab:hover { background: var(--tab-hover); }
  .tweet { display: flex; gap: 8px; padding: 12px 16px 4px; border-bottom: 1px solid var(--line); }
  .tweet:hover { background: var(--hover); }
  .avatar { width: 40px; height: 40px; border-radius: 50%; flex: none; object-fit: cover; background: var(--avatar); }
  .body { min-width: 0; flex: 1; }
  .meta { display: flex; gap: 4px; white-space: nowrap; overflow: hidden; }
  .name { font-weight: 700; overflow: hidden; text-overflow: ellipsis; }
  .handle, .time { color: var(--muted); }
  .handle { overflow: hidden; text-overflow: ellipsis; }
  .text { white-space: pre-wrap; overflow-wrap: anywhere; margin-top: 2px; }
  .text a { color: var(--blue); text-decoration: none; }
  .actions { display: flex; margin: 4px 0 0 -8px; color: var(--muted); font-size: 13px; }
  .act { display: flex; align-items: center; gap: 2px; background: none; border: 0; color: inherit; font: inherit; padding: 0; cursor: pointer; }
  .act svg { width: 34px; height: 34px; padding: 8px; border-radius: 50%; fill: currentColor; }
  .act.like:hover, .act.like.on { color: var(--pink); } .act.like:hover svg { background: rgba(249,24,128,.1); }
  .act.like .on-icon, .act.like.on .off-icon { display: none; }
  .act.like.on .on-icon { display: block; }
  #more { display: flex; justify-content: center; padding: 24px; }
  .spinner { width: 26px; height: 26px; border: 3px solid rgba(29,155,240,.25); border-top-color: var(--blue);
             border-radius: 50%; animation: spin .75s linear infinite; }
  @keyframes spin { to { transform: rotate(360deg); } }
  #info { display: none; position: fixed; inset: 20px; z-index: 9; background: #000d; color: #fff; padding: 16px;
          overflow: auto; font: 12px/1.4 ui-monospace, monospace; white-space: pre-wrap; border-radius: 12px; }
</style>
</head>
<body>
<div id="feed">
  <nav class="tabs"><div class="tab on"><span>For you</span></div><div class="tab"><span>Following</span></div></nav>
  <div id="tweets"></div>
  <div id="more"><div class="spinner"></div></div>
</div>
<pre id="info"></pre>
<script>
const tweets = document.getElementById("tweets");
const more = document.getElementById("more");
const info = document.getElementById("info");

const ICON = {
  like: '<path d="M16.697 5.5c-1.222-.06-2.679.51-3.89 2.16l-.805 1.09-.806-1.09C9.984 6.01 8.526 5.44 7.304 5.5c-1.243.07-2.349.78-2.91 1.91-.552 1.12-.633 2.78.479 4.82 1.074 1.97 3.257 4.27 7.129 6.61 3.87-2.34 6.052-4.64 7.126-6.61 1.111-2.04 1.03-3.7.477-4.82-.561-1.13-1.666-1.84-2.908-1.91zm4.187 7.69c-1.351 2.48-4.001 5.12-8.379 7.67l-.503.3-.504-.3c-4.379-2.55-7.029-5.19-8.382-7.67-1.36-2.5-1.41-4.86-.514-6.67.887-1.79 2.647-2.91 4.601-3.01 1.651-.09 3.368.56 4.798 2.01 1.429-1.45 3.146-2.1 4.796-2.01 1.954.1 3.714 1.22 4.601 3.01.896 1.81.846 4.17-.514 6.67z"/>',
  liked: '<path d="M20.884 13.19c-1.351 2.48-4.001 5.12-8.379 7.67l-.503.3-.504-.3c-4.379-2.55-7.029-5.19-8.382-7.67-1.36-2.5-1.41-4.86-.514-6.67.887-1.79 2.647-2.91 4.601-3.01 1.651-.09 3.368.56 4.798 2.01 1.429-1.45 3.146-2.1 4.796-2.01 1.954.1 3.714 1.22 4.601 3.01.896 1.81.846 4.17-.514 6.67z"/>',
};
const svg = (p, cls = "") => `<svg viewBox="0 0 24 24" class="${cls}" aria-hidden="true">${p}</svg>`;
const DEFAULT_AVATAR = "data:image/svg+xml," + encodeURIComponent(
  '<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 40 40"><rect width="40" height="40" fill="#cfd9de"/>' +
  '<circle cx="20" cy="16" r="7" fill="#fff"/><path d="M6 38c1-8 7-12 14-12s13 4 14 12z" fill="#fff"/></svg>');

const compact = new Intl.NumberFormat("en", { notation: "compact", maximumFractionDigits: 1 });
const count = n => (n > 0 ? compact.format(n) : "");
function when(minutes) {
  if (minutes < 60) return `${Math.max(1, minutes)}m`;
  if (minutes < 1440) return `${Math.floor(minutes / 60)}h`;
  return new Date(Date.now() - minutes * 60000).toLocaleDateString("en-US", { month: "short", day: "numeric" });
}
const esc = s => s.replace(/[&<>"]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" })[c]);
const linkify = s => esc(s).replace(/(^|[^\w])([#@][\p{L}\p{N}_]+|https?:\/\/\S+)/gu, '$1<a href="#">$2</a>');

// A tweet is rated once it scrolls off the top: liked = 1, otherwise 0.
const seen = new IntersectionObserver(entries => {
  for (const e of entries) {
    const el = e.target;
    if (!e.isIntersecting && e.boundingClientRect.bottom < 0 && !el.dataset.rated) {
      el.dataset.rated = "1";
      fetch("/rate", { method: "POST", body: JSON.stringify({ id: +el.dataset.id, reward: +!!el.dataset.liked }) })
        .catch(err => console.warn("rate failed", err));
      seen.unobserve(el);
    }
  }
});

function render({ id, text, author, stats }) {
  const el = document.createElement("article");
  el.className = "tweet";
  el.dataset.id = id;
  el.innerHTML = `<img class="avatar" alt="" src="${esc(author.avatar)}" onerror="this.onerror=null;this.src=DEFAULT_AVATAR">
    <div class="body">
      <div class="meta"><span class="name">${esc(author.name)}</span><span class="handle">@${esc(author.handle)}</span>
        <span class="time">· ${when(stats.minutes_ago)}</span></div>
      <div class="text">${linkify(text)}</div>
      <div class="actions">
        <button class="act like">${svg(ICON.like, "off-icon")}${svg(ICON.liked, "on-icon")}<span>${count(stats.likes)}</span></button>
      </div>
    </div>`;
  const like = el.querySelector(".like");
  like.onclick = ev => {
    ev.stopPropagation();
    if (el.dataset.rated) return;  // already scrolled past: rating is final
    el.dataset.liked = el.dataset.liked ? "" : "1";
    like.classList.toggle("on", !!el.dataset.liked);
    like.querySelector("span").textContent = count(stats.likes + (el.dataset.liked ? 1 : 0));
  };
  tweets.append(el);
  seen.observe(el);
}

// Infinite scroll: load one tweet at a time while the bottom is near.
// On any error, retry after a pause; never leave `loading` stuck.
let loading = false, nearBottom = true;
const sleep = ms => new Promise(r => setTimeout(r, ms));
async function load() {
  if (loading) return;
  loading = true;
  try {
    while (nearBottom) {
      try {
        const res = await fetch("/next");
        if (!res.ok) throw new Error(`HTTP ${res.status}`);
        render(await res.json());
      } catch (err) {
        console.warn("load failed, retrying", err);
        await sleep(2000);
      }
    }
  } finally {
    loading = false;
  }
}
new IntersectionObserver(([e]) => { nearBottom = e.isIntersecting; load(); }, { rootMargin: "800px" }).observe(more);

// Hidden: press "i" to show/hide experiment info.
addEventListener("keydown", async e => {
  if (e.key !== "i") return;
  if (info.style.display === "block") return (info.style.display = "none");
  info.textContent = await (await fetch("/info")).text();
  info.style.display = "block";
});
</script>
</body>
</html>
