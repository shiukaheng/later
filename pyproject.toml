[project]
name = "later"
version = "0.1.0"
description = "Language Arms for Thompson-based Evolving Recommendation"
readme = "README.md"
authors = [
    { name = "Heng", email = "31088159+shiukaheng@users.noreply.github.com" }
]
requires-python = ">=3.14"
dependencies = [
    "faker>=40.54.0",
    "numpy>=2.5.5",
    "openai>=3.52.0",
    "pydantic>=2.14.3",
    "python-dotenv>=1.2.4",
    "scipy>=1.18.1",
    "unidecode>=1.4.0",
]

[project.scripts]
later = "later.main:main"
later-web = "later.web:main"

[build-system]
requires = ["uv_build>=0.9.7,<0.10.0"]
build-backend = "uv_build"
